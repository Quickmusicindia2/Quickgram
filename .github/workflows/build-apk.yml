name: Build Quickgram Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Add Android platform and sync
        run: |
          npm install @capacitor/android@^6.2.0
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quickgram-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
